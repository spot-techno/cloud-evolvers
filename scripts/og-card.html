<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;600;800&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
      .card {
        width: 1200px;
        height: 630px;
        background: #f7f6f2;
        color: #293141;
        font-family: "Space Grotesk", system-ui, sans-serif;
        position: relative;
        box-sizing: border-box;
        padding: 80px 80px 72px;
      }
      .bar { position: absolute; left: 0; top: 0; width: 12px; height: 630px; background: #0f8a69; }
      .mark { font-size: 120px; font-weight: 800; line-height: 1; letter-spacing: 0; }
      .c { color: #22c55e; }
      .e { color: #1A2E3C; }
      .name {
        margin-top: 18px;
        font-family: "Instrument Serif", Georgia, serif;
        font-size: 64px;
        font-weight: 400;
        line-height: 1;
      }
      .lede { margin-top: 22px; font-size: 28px; color: #5b6474; }
      .meta {
        position: absolute;
        left: 80px;
        bottom: 72px;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.14em;
        color: #0f8a69;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="bar"></div>
      <div class="mark"><span class="c">c</span><span class="e">e</span><span class="c">.</span></div>
      <div class="name">Cloud Evolvers</div>
      <div class="lede">Azure training from an active Azure architect.</div>
      <div class="meta">MCT  ·  NL / EN  ·  SPOT CLOUD B.V.</div>
    </div>
  </body>
</html>
